
<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="kurdish%20wordle%20logo.png">
<title>Kurdish Wordle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+Arabic:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #201829;
    --bg-deep: #160f1e;
    --tile-empty: #2e2440;
    --tile-border: #453862;
    --correct: #33d17a;
    --present: #ffc857;
    --absent: #4a4358;
    --danger: #ff4757;
    --cream: #f5f0ff;
    --pink: #ff5d8f;
    --blue: #4cc9f0;
    --purple: #b388ff;
    --shadow: rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,93,143,0.15), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(76,201,240,0.15), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(179,136,255,0.12), transparent 50%),
      var(--bg);
    font-family: 'Noto Sans Arabic', 'Noto Naskh Arabic', Tahoma, sans-serif;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    margin: 0;
    background: linear-gradient(90deg, var(--pink), var(--purple) 50%, var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 6px 24px rgba(179,136,255,0.25);
    line-height: 1.4;
  }

  .subtitle {
    font-size: 0.85rem;
    letter-spacing: 1px;
    color: var(--purple);
    opacity: 0.85;
    margin-top: 4px;
    font-weight: 700;
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 14px 0 6px;
    font-size: 0.78rem;
    font-weight: 700;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--tile-border);
  }

  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
  }

  .swatch.correct { background: var(--correct); }
  .swatch.present { background: var(--present); }
  .swatch.absent { background: var(--absent); }

  #board {
    display: grid;
    gap: 8px;
    margin: 22px 0 10px;
    direction: rtl;
  }

  .row {
    display: grid;
    grid-auto-flow: column;
    gap: 8px;
    direction: rtl;
  }

  .tile {
    width: 56px;
    height: 56px;
    border: 2px solid var(--tile-border);
    border-radius: 10px;
    background: var(--tile-empty);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    transition: transform 0.12s ease, border-color 0.12s ease;
    position: relative;
  }

  .tile.filled {
    border-color: var(--purple);
    transform: scale(1.04);
  }

  .tile.flip {
    animation: flip 0.55s ease forwards;
  }

  .tile.shake {
    animation: shake 0.4s ease;
  }

  .tile.bounce {
    animation: bounce 0.5s ease;
  }

  @keyframes flip {
    0%   { transform: rotateX(0deg); }
    45%  { transform: rotateX(90deg); }
    55%  { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-14px); }
    50% { transform: translateY(0); }
    70% { transform: translateY(-6px); }
  }

  .tile.correct { background: var(--correct); border-color: var(--correct); color: var(--bg-deep); }
  .tile.present { background: var(--present); border-color: var(--present); color: var(--bg-deep); }
  .tile.absent  { background: var(--absent);  border-color: var(--absent); color: var(--cream); }

  #message {
    min-height: 26px;
    font-weight: 800;
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', sans-serif;
    font-size: 1.05rem;
    margin: 6px 0 14px;
    text-align: center;
  }

  #message.win { color: var(--correct); }
  #message.lose { color: var(--pink); }
  #message.warn { color: var(--present); }

  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    direction: rtl;
  }

  .krow {
    display:flex;
    gap:6px;
    direction:rtl;
    width:100%;
    max-width:720px;
}
.key{
    flex:1;
}

  .key {
    min-width: 34px;
    height: 46px;
    padding: 0 8px;
    border-radius: 8px;
    border: none;
    background: var(--tile-empty);
    color: var(--cream);
    font-family: 'Noto Sans Arabic', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    border: 1px solid var(--tile-border);
  }

  .key:hover { transform: translateY(-2px); }
  .key:active { transform: translateY(0); }

  .key.correct { background: var(--correct); color: var(--bg-deep); border-color: var(--correct); }
  .key.present { background: var(--present); color: var(--bg-deep); border-color: var(--present); }
  .key.absent  { background: var(--absent); color: rgba(245,240,255,0.55); border-color: var(--absent); }

  #key-ENTER,#key-DEL{
flex:2.3;
}
#key-ENTER { background: var(--correct); border-color: var(--correct); color: var(--bg-deep); }
#key-DEL   { background: var(--danger); border-color: var(--danger); color: var(--cream); }

  #controls {
    margin-top: 22px;
    display: flex;
    gap: 12px;
  }

  .btn {
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: var(--cream);
    box-shadow: 0 6px 18px var(--shadow);
    transition: transform 0.15s ease;
  }

  .btn:hover { transform: translateY(-2px); }

  footer {
    margin-top: 28px;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    color: rgba(245,240,255,0.4);
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,6,16,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  #overlay.show {
    display: flex;
  }

  .modal {
    background: var(--bg-deep);
    border: 1px solid var(--tile-border);
    border-radius: 18px;
    padding: 28px 26px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px var(--shadow);
    direction: rtl;
  }

  .modal .icon {
    font-size: 2.2rem;
    margin-bottom: 6px;
  }

  .modal h2 {
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', sans-serif;
    font-size: 1.3rem;
    margin: 0 0 10px;
  }

  .modal h2.win { color: var(--correct); }
  .modal h2.lose { color: var(--pink); }

  .modal .word-reveal {
    font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--blue);
    margin: 4px 0 16px;
    letter-spacing: 2px;
  }

  .modal .ask {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--cream);
    margin-bottom: 18px;
  }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
@media (max-width:600px){
body{padding:12px 8px 24px;}
#board{width:100%;max-width:100vw;}
.row{gap:4px;}
.tile{width:min(calc((100vw - 40px)/8),48px);height:min(calc((100vw - 40px)/8),48px);font-size:1.5rem;}
#keyboard{width:100%;}
.krow{width:100%;max-width:100%;}
.key{height:42px;font-size:.9rem;padding:0 2px;}
#key-ENTER,#key-DEL{flex:2.2;font-size:.8rem;}
footer{font-size:.7rem;text-align:center;}
}
</style>
</head>
<body>


<div id="welcomeOverlay" class="show" style="position:fixed;inset:0;background:rgba(10,6,16,.85);display:flex;align-items:center;justify-content:center;z-index:1000">
<div class="modal">
<h2>بەخێربێیت بۆ یاری دۆزینەوەی وشە</h2>
<p style="line-height:2">
🟩 : پیتەکە لە شوێنی ڕاستدایە.<br>
🟨 : پیتەکە هەیە بەڵام شوێنی هەڵەیە.<br>
⬜ : پیتەکە لە وشەکەدا نییە.
</p>
<button class="btn" id="startGameBtn">دەستپێکردن</button>
</div></div>

<header>
  <h1>وشەکە بدۆزەوە</h1>
  <div class="subtitle" id="subtitle"></div>
</header>

<!--<div class="legend">
  <span><span class="swatch correct"></span>شوێنی ڕاستە</span>
  <span><span class="swatch present"></span>هەیە، شوێنی هەڵەیە</span>
  <span><span class="swatch absent"></span>لە وشەکەدا نییە</span>
</div>-->

<div id="board"></div>
<div id="message"></div>

<div id="keyboard"></div>

<div id="controls">
  <button class="btn" id="newGameBtn">وشەیەکی نوێ</button>
</div>

<footer>وشەیەک بنووسە و کلیلی ENTER لێبدە</footer>
<footer>Mohammed Omer-2026</footer>

<div id="overlay">
  <div class="modal">
    <div class="icon" id="modalIcon">🎉</div>
    <h2 id="modalTitle"></h2>
    <div class="word-reveal" id="modalWord"></div>
    <!--<div class="ask">دەتەوێت دووبارە یاری بکەیت؟</div>-->
    <div class="modal-btns">
      <button class="btn" id="playAgainBtn">وشەیەکی نوێ</button>
    </div>
  </div>
</div>

<script>
(function () {
  // Kurdish words (variable length)
  const WORDS = ["چاو","دار","زەڕافە","زانکۆ","گوڵ","میوە","کراس","گڵۆپ","موبایل","کورسی","مێز","شێرەکەیبازیان","باران","دەرگا","خەیاڵ","نەورۆز","ھەزار","چیرۆک","کۆمپیتەر","سەرما","ھاوڕێ"];
  const MAX_ATTEMPTS = 5;

  // Sorani Kurdish alphabet, laid out in rows for the on-screen keyboard
  const KEY_ROWS = [
    ["ئ","ا","ب","پ","ت","ج","چ","ح","خ","د","ر"],
    ["ڕ","ز","ژ","س","ش","ع","غ","ف","ڤ","ق","ک"],
    ["گ","ل","ڵ","م","ن","و","ۆ","ە","ھ","ی","ێ"],
    ["ENTER","DEL"]
  ];

  const EASTERN_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  function toEasternDigits(n) {
    return String(n).split("").map(d => EASTERN_DIGITS[d] ?? d).join("");
  }

  let word = "";
  let wordLength = 5;
  let currentGuess = "";
  let attempt = 0;
  let gameOver = false;
  const keyStates = {};
  const validLetters = new Set(KEY_ROWS.flat().filter(k => k !== "ENTER" && k !== "DEL"));

  const boardEl = document.getElementById("board");
  const messageEl = document.getElementById("message");
  const keyboardEl = document.getElementById("keyboard");
  const subtitleEl = document.getElementById("subtitle");
  const newGameBtn = document.getElementById("newGameBtn");
  const overlayEl = document.getElementById("overlay");
  const modalIcon = document.getElementById("modalIcon");
  const modalTitle = document.getElementById("modalTitle");
  const modalWord = document.getElementById("modalWord");
  const playAgainBtn = document.getElementById("playAgainBtn");

  function scoreGuess(word, guess) {
    const len = word.length;
    const result = new Array(len).fill("absent");
    const counts = {};
    for (const ch of word) counts[ch] = (counts[ch] || 0) + 1;

    for (let i = 0; i < len; i++) {
      if (guess[i] === word[i]) {
        result[i] = "correct";
        counts[guess[i]]--;
      }
    }
    for (let i = 0; i < len; i++) {
      if (result[i] === "correct") continue;
      if (counts[guess[i]] > 0) {
        result[i] = "present";
        counts[guess[i]]--;
      }
    }
    return result;
  }

  function updateSubtitle() {
    subtitleEl.textContent = `${toEasternDigits(wordLength)} پیت · ${toEasternDigits(MAX_ATTEMPTS)} هەوڵ`;
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    boardEl.style.gridTemplateRows = `repeat(${MAX_ATTEMPTS}, 1fr)`;
    for (let r = 0; r < MAX_ATTEMPTS; r++) {
      const row = document.createElement("div");
      row.className = "row";
      row.id = `row-${r}`;
      for (let c = 0; c < wordLength; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = `tile-${r}-${c}`;
        row.appendChild(tile);
      }
      boardEl.appendChild(row);
    }
  }

  function buildKeyboard() {
    keyboardEl.innerHTML = "";
    KEY_ROWS.forEach(rowKeys => {
      const krow = document.createElement("div");
      krow.className = "krow";
      rowKeys.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = k === "DEL" ? "⌫" : (k === "ENTER" ? "⏎" : k);
        btn.id = `key-${k}`;
        btn.addEventListener("click", () => handleKey(k));
        krow.appendChild(btn);
      });
      keyboardEl.appendChild(krow);
    });
  }

  function setMessage(text, cls) {
    messageEl.textContent = text;
    messageEl.className = cls || "";
  }

  function updateKeyStates(guess, result) {
    const rank = { absent: 0, present: 1, correct: 2 };
    for (let i = 0; i < guess.length; i++) {
      const letter = guess[i];
      const state = result[i];
      if (!keyStates[letter] || rank[state] > rank[keyStates[letter]]) {
        keyStates[letter] = state;
      }
      const keyEl = document.getElementById(`key-${letter}`);
      if (keyEl) {
        keyEl.classList.remove("correct", "present", "absent");
        keyEl.classList.add(keyStates[letter]);
      }
    }
  }

  function showEndModal(won) {
    modalIcon.textContent = won ? "🎉" : "😔";
    modalTitle.textContent = won ? "!پیرۆزە، بردتەوە!" : "وشە ڕاستەکە:";
    modalTitle.className = won ? "win" : "lose";
    modalWord.textContent = word;
    overlayEl.classList.add("show");
  }

  function shakeRow(r) {
    for (let c = 0; c < wordLength; c++) {
      const tile = document.getElementById(`tile-${r}-${c}`);
      tile.classList.add("shake");
      setTimeout(() => tile.classList.remove("shake"), 400);
    }
  }

  function submitGuess() {
    if (gameOver) return;
    if (currentGuess.length !== wordLength) {
      setMessage(`تکایە ${toEasternDigits(wordLength)} پیت بنووسە`, "warn");
      shakeRow(attempt);
      return;
    }

    const guess = currentGuess;
    const result = scoreGuess(word, guess);

    for (let c = 0; c < wordLength; c++) {
      const tile = document.getElementById(`tile-${attempt}-${c}`);
      tile.textContent = guess[c];
      setTimeout(() => {
        tile.classList.add(result[c]);
      }, c * 90 + 250);
      tile.classList.add("flip");
      tile.style.animationDelay = `${c * 90}ms`;
    }

    setTimeout(() => {
      updateKeyStates(guess, result);

      if (guess === word) {
        gameOver = true;
        setMessage("🎉 وشەکەت دۆزییەوە!", "win");
        for (let c = 0; c < wordLength; c++) {
          const tile = document.getElementById(`tile-${attempt}-${c}`);
          tile.style.animationDelay = `${c * 60}ms`;
          tile.classList.add("bounce");
        }
        setTimeout(() => showEndModal(true), 500);
      } else {
        attempt++;
        if (attempt >= MAX_ATTEMPTS) {
          gameOver = true;
          setMessage(`هەوڵەکانت تەواو بوون! وشەکە ${word} بوو`, "lose");
          setTimeout(() => showEndModal(false), 300);
        } else {
          const left = MAX_ATTEMPTS - attempt;
          setMessage(left === 1 ? "کۆتا هەوڵە!" : `${toEasternDigits(left)} هەوڵت ماوە`, "");
        }
      }
    }, wordLength * 90 + 300);

    currentGuess = "";
  }

  function handleKey(key) {
    if (gameOver) return;
    if (key === "ENTER") {
      submitGuess();
      return;
    }
    if (key === "DEL") {
      currentGuess = currentGuess.slice(0, -1);
    } else if (validLetters.has(key) && currentGuess.length < wordLength) {
      currentGuess += key;
    } else {
      return;
    }
    renderCurrentRow();
  }

  function renderCurrentRow() {
    for (let c = 0; c < wordLength; c++) {
      const tile = document.getElementById(`tile-${attempt}-${c}`);
      const letter = currentGuess[c] || "";
      tile.textContent = letter;
      tile.classList.toggle("filled", !!letter);
    }
    setMessage("", "");
  }

  function newGame() {
    word = WORDS[Math.floor(Math.random() * WORDS.length)];
    wordLength = word.length;
    currentGuess = "";
    attempt = 0;
    gameOver = false;
    for (const k in keyStates) delete keyStates[k];
    document.querySelectorAll(".key").forEach(k => k.classList.remove("correct", "present", "absent"));
    updateSubtitle();
    buildBoard();
    setMessage("", "");
    overlayEl.classList.remove("show");
  }

const keyMapByCode = {
    // Top row
    "Backquote": "ژ",
    "Digit1": "١",
    "Digit2": "٢",
    "Digit3": "٣",
    "Digit4": "٤",
    "Digit5": "٥",
    "Digit6": "٦",
    "Digit7": "٧",
    "Digit8": "٨",
    "Digit9": "٩",
    "Digit0": "٠",

    "KeyQ": "ق",
    "KeyW": "و",
    "KeyE": "ە",
    "KeyR": "ر",   // Shift handled separately
    "KeyT": "ت",
    "KeyY": "ی",
    "KeyU": "ۇ",
    "KeyI": "ێ",
    "KeyO": "ۆ",
    "KeyP": "پ",

    // Middle row
    "KeyA": "ا",
    "KeyS": "س",
    "KeyD": "د",
    "KeyF": "ف",
    "KeyG": "گ",
    "KeyH": "ھ",
    "KeyJ": "ج",
    "KeyK": "ک",
    "KeyL": "ل",

    // Bottom row
    "KeyZ": "ز",
    "KeyX": "خ",
    "KeyC": "چ",
    "KeyV": "ڤ",
    "KeyB": "ب",
    "KeyN": "ن",
    "KeyM": "م",

    // Extra keys
    "BracketLeft": "ح",
    "BracketRight": "ع",
    "Backslash": "غ",
    "Semicolon": "ڵ",
    "Quote": "ئ"
};

  document.addEventListener("keydown", (e) => {
    if (gameOver) return;
    if (e.code === "Enter") return handleKey("ENTER");
    if (e.code === "Backspace") return handleKey("DEL");
    if (e.code === "KeyR") {
      return handleKey(e.shiftKey ? "ڕ" : "ر");
    }
    const ch = keyMapByCode[e.code];
    if (ch) return handleKey(ch);
    if (validLetters.has(e.key)) return handleKey(e.key);
  });

  newGameBtn.addEventListener("click", newGame);
  playAgainBtn.addEventListener("click", newGame);

  buildKeyboard();
  document.getElementById("startGameBtn").onclick=()=>document.getElementById("welcomeOverlay").style.display="none";
  newGame();
})();
</script>

</body>
</html>
